<div class="mlr-10">
  <svg-icon
    src="../../../assets/images/svg/palette.svg"
    class="pointer"
    (click)="panelPalette.toggle($event)"
  ></svg-icon>

  <p-popover #panelPalette appendTo="body">
    <div>
      <div class="primary-colors-container mb-20">
        <span class="font-size-medium mb-5">Primary Colors</span>
        <div class="primary-color">
          @for (primaryColor of primaryColors(); track trackPrimaryColor($index, primaryColor)) {
            <button
              type="button"
              [pTooltip]="primaryColor.name"
              tooltipPosition="bottom"
              (click)="updateColors($event, 'primary', primaryColor)"
              class="pointer"
            [ngStyle]="{
              'background-color':
                primaryColor.name === 'noir' ? 'var(--p-surface-0)' : primaryColor.palette['500'],
              'outline-color':
                selectedPrimaryColor() === primaryColor.name ? 'var(--p-primary-color)' : '',
            }"
            ></button>
          }
        </div>
      </div>
      <div class="surface-colors-container mb-20">
        <span class="font-size-medium mb-5">Surface Colors</span>
        <div class="surface-color">
          @for (surface of surfaces; track trackSurface($index, surface)) {
            <button
              type="button"
              [pTooltip]="surface.name"
              tooltipPosition="bottom"
              (click)="updateColors($event, 'surface', surface)"
              class="outline outline-2 outline-offset-1 outline-transparent cursor-pointer p-0 rounded-[50%] w-5 h-5"
            [ngStyle]="{
              'background-color': surface.palette['500'],
              'outline-color':
                selectedSurfaceColor() === surface.name ? 'var(--p-primary-color)' : '',
            }"
            ></button>
          }
        </div>
      </div>
      <div class="preset-container mb-20">
        <span class="preset-label font-size-medium mb-5">Preset</span>
        <div>
          <p-selectbutton
            [options]="presets"
            [ngModel]="selectedPreset()"
            (ngModelChange)="onPresetChange($event)"
            [unselectable]="true"
            size="small"
            />
        </div>
      </div>
      <div class="ripple-container">
        <span class="font-size-medium mb-5">Ripple Effect</span>
        <p-toggleswitch [(ngModel)]="ripple" />
      </div>
    </div>
  </p-popover>
</div>
