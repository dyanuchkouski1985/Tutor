<div>
  <svg-icon
    src="../../../assets/images/svg/palette.svg"
    class="pointer"
    (click)="panelPalette.toggle($event)"
  ></svg-icon>

  <app-popover #panelPalette panelClass="ui-popover-animated">
    <div>
      <div class="mode-container mb-20">
        <span class="font-size-medium mb-5">Mode</span>
        <app-select-button
          [options]="modeOptions"
          [ngModel]="isDark()"
          (ngModelChange)="setDark($event)"
          size="small"
          optionLabel="label"
          optionValue="value"
        />
      </div>
      <div class="primary-colors-container mb-20">
        <span class="font-size-medium mb-5">Primary Colors</span>
        <div class="primary-color">
          @for (primaryColor of primaryColors; track primaryColor; let index = $index) {
            <button
              type="button"
              [appTooltip]="primaryColor"
              tooltipPosition="bottom"
              (click)="updateColors('primary', primaryColor)"
              class="pointer"
              [style.--index]="index"
              [ngStyle]="{
                'background-color':
                  primaryColor === 'noir'
                    ? 'var(--ui-surface-0)'
                    : 'var(--theme-' + primaryColor + '-500)',
                'outline-color':
                  selectedPrimaryColor() === primaryColor ? 'var(--ui-primary-color)' : '',
              }"
            ></button>
          }
        </div>
      </div>
      <div class="surface-colors-container">
        <span class="font-size-medium mb-5">Surface Colors</span>
        <div class="surface-color">
          @for (surface of surfaces; track surface.name; let index = $index) {
            <button
              type="button"
              [appTooltip]="surface.name"
              tooltipPosition="bottom"
              (click)="updateColors('surface', surface.name)"
              [style.--index]="index"
              [ngStyle]="{
                'background-color': surface.palette['500'],
                'outline-color':
                  selectedSurfaceColor() === surface.name ? 'var(--ui-primary-color)' : '',
              }"
            ></button>
          }
        </div>
      </div>
    </div>
  </app-popover>
</div>
